<div id="geral">

    <div id="cabecario">

        <h2>
            {{ !edit ? 'Cadastrar':'Alterar'}} de Corridas
        </h2>
    </div>
    <div id="link">
        <a routerLink='/lista-corrida'><strong>Conferir Corridas</strong></a>
    </div>


    <form id="form" (submit)="enviarDadosCorrida()">

        <label for="descri">Descrição da Corrida</label>
        <textarea name="descri" id="descri" cols="50" rows="6" placeholder="Ex- Maratona Internacional de João Pessoa"
            [(ngModel)]='descricao'></textarea>

        <label for="date">Data da Corrida</label>
        <input type="date" name="date" id="date" class="d-size" [(ngModel)]='data'>

        <label for="dist">Distância Disponível</label>
        <select name="dist" id="dist" class="d-size" [(ngModel)]='distancia'>

            <option value="5km">5km</option>
            <option value="10km">10km</option>
            <option value="25km">25km</option>
            <option value="50km">50km</option>
            <option value="100km">100km</option>

        </select>

        <div id="btns">
            <button type="submit" (click)="enviarDadosCorrida()">{{ !edit ? 'Cadastrar':'Alterar'}}</button>
        </div>
    </form>

</div>
