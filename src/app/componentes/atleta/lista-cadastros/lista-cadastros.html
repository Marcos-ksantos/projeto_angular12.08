
<div id="form">


@for(elem of ListaAtletas();track elem.idpessoa){
    <div class="cliente">
<p> {{elem.idpessoa}}</p>
<p>Nome: <strong>{{elem.nome}}</strong></p>
<p>Idade: <strong>{{idadeCliente(elem.datanascimento)}}</strong></p>

<p>GÊNERO: <strong>{{elem.sexo}}</strong></p>


<div id="btns">
    <button type="button" class="Alterar" (click)="  CarregaDadosAtletaForm(elem)">Alterar</button>
    <button type="button" class="Excluir" (click)="excluir(elem.idpessoa)">Excluir</button>
</div>

      </div>
}@empty{
    <div class="sem-cadastros">
<p>Nenhum Cadastro Registrado</p>
    </div>
}


</div>
